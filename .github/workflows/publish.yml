name: Stage npm release

on:
  workflow_dispatch:
    inputs:
      package_sha256:
        description: SHA-256 of the approved npm tarball (required for staging)
        type: string
      verify_only:
        description: Check npm authentication without staging a package
        type: boolean
        default: false

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  stage:
    if: >-
      github.repository == 'bitavu/bitavu-node' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'muveaio' &&
      github.triggering_actor == 'muveaio'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.2
      - run: npm ci
      - run: npm test
      - run: npm run check:package
      - name: Verify npm trusted publishing
        if: ${{ inputs.verify_only }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const tokenURL = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenURL.searchParams.set('audience', 'npm:registry.npmjs.org');
          const github = await fetch(tokenURL, {
            headers: { Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN },
            redirect: 'error',
            signal: AbortSignal.timeout(15000),
          });
          if (!github.ok) throw new Error('GitHub OIDC request failed with HTTP ' + github.status);
          const { value: identity } = await github.json();
          if (!identity) throw new Error('GitHub returned no OIDC identity.');

          const registry = await fetch('https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/%40bitavu%2Fclient', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + identity },
            redirect: 'error',
            signal: AbortSignal.timeout(15000),
          });
          if (registry.status !== 201) throw new Error('npm OIDC exchange failed with HTTP ' + registry.status);
          await registry.body?.cancel();
          console.log('npm accepted the GitHub Actions identity for @bitavu/client.');
          NODE
      - name: Stage the reviewed tarball
        if: ${{ !inputs.verify_only }}
        shell: bash
        env:
          APPROVED_SHA256: ${{ inputs.package_sha256 }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          shopt -s nullglob
          packages=(artifacts/*.tgz)
          [[ ${#packages[@]} -eq 1 ]]
          printf '%s  %s\n' "$APPROVED_SHA256" "${packages[0]}" | sha256sum --check
          npm stage publish "${packages[0]}" --access public
